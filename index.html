<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>The Aana Verse — Digital Business Card</title>
<style>
:root{
  --bg:#f4f1ec; --ink:#171717; --muted:#77736d; --card:#fffdf9;
  --line:#e5e0d8; --accent:#111; --shadow:0 24px 70px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:28px 16px; background:linear-gradient(135deg,#f7f5f1,#eae6df);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
}
.card{
  width:min(430px,100%); background:var(--card); border:1px solid rgba(0,0,0,.06);
  border-radius:30px; box-shadow:var(--shadow); overflow:hidden;
}
.hero{
  position:relative; padding:42px 26px 26px; text-align:center;
  background:#111; color:#fff; min-height:230px; display:flex;
  flex-direction:column; justify-content:center; align-items:center;
}
.logo{
  width:min(330px,88%); max-height:120px; object-fit:contain;
  filter:brightness(0) invert(1); margin-bottom:18px;
}
.brand{font-size:13px; letter-spacing:.28em; text-transform:uppercase; opacity:.72}
.content{padding:26px}
.action{
  display:flex; align-items:center; gap:14px; width:100%; padding:15px 16px;
  margin:10px 0; border:1px solid var(--line); border-radius:17px;
  color:var(--ink); text-decoration:none; background:#fff; transition:.2s;
}
.action:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.07)}
.icon{width:30px; text-align:center; font-size:20px}
.label{font-weight:650}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.save{
  display:block; width:100%; border:0; padding:17px; border-radius:17px;
  background:#111;color:#fff;font-weight:750;font-size:15px;cursor:pointer;margin:4px 0 20px;
}
.save:hover{opacity:.9}
.social-title{text-align:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:25px 0 12px}
.qrbox{
  margin:24px auto 4px; padding:18px; width:190px; border:1px solid var(--line);
  border-radius:22px; background:#fff; text-align:center;
}
#qrcode{display:flex;justify-content:center}
.qrhelp{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:0 20px 24px}
@media(max-width:380px){.content{padding:20px}.hero{min-height:205px}}
</style>
</head>
<body>
<main class="card">
  <section class="hero">
    <img class="logo" src="logo.png" alt="The Aana Verse">
    <div class="brand">Digital Business Card</div>
  </section>

  <section class="content">
    <button class="save" onclick="downloadVCard()">＋ Save Contact</button>

    <a class="action" href="tel:+9779717389094">
      <span class="icon">☎</span><span><div class="label">Call</div><div class="sub">+977 9717389094</div></span>
    </a>

    <a class="action" href="https://wa.me/9779717389094" target="_blank" rel="noopener">
      <span class="icon">💬</span><span><div class="label">WhatsApp</div><div class="sub">Message us on WhatsApp</div></span>
    </a>

    <a class="action" href="mailto:theaanaverse@gmail.com">
      <span class="icon">✉</span><span><div class="label">Email</div><div class="sub">theaanaverse@gmail.com</div></span>
    </a>

    <div class="social-title">Connect with us</div>

    <a class="action" href="https://www.facebook.com/theaanaverse" target="_blank" rel="noopener">
      <span class="icon">f</span><span><div class="label">Facebook</div><div class="sub">facebook.com/theaanaverse</div></span>
    </a>

    <a class="action" href="https://www.instagram.com/theaanaverse/" target="_blank" rel="noopener">
      <span class="icon">◎</span><span><div class="label">Instagram</div><div class="sub">@theaanaverse</div></span>
    </a>

    <a class="action" href="https://www.tiktok.com/@theaanaverse" target="_blank" rel="noopener">
      <span class="icon">♪</span><span><div class="label">TikTok</div><div class="sub">@theaanaverse</div></span>
    </a>

    <div class="qrbox">
      <div id="qrcode"></div>
      <div class="qrhelp">Scan to open this digital business card</div>
    </div>
  </section>

  <div class="footer">The Aana Verse · Tap any button to connect</div>
</main>

<script>
function downloadVCard(){
  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:The Aana Verse
ORG:The Aana Verse
TEL;TYPE=CELL:+9779717389094
EMAIL;TYPE=INTERNET:theaanaverse@gmail.com
URL:https://www.facebook.com/theaanaverse
URL:https://www.instagram.com/theaanaverse/
URL:https://www.tiktok.com/@theaanaverse
URL:https://wa.me/9779717389094
NOTE:Facebook: https://www.facebook.com/theaanaverse\\nInstagram: https://www.instagram.com/theaanaverse/\\nTikTok: https://www.tiktok.com/@theaanaverse\\nWhatsApp: https://wa.me/9779717389094
END:VCARD`;
  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "The_Aana_Verse.vcf";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Generate the QR from the page's current URL after hosting.
// Uses a free open-source QR library from jsDelivr.
const s=document.createElement('script');
s.src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";
s.onload=()=>new QRCode(document.getElementById("qrcode"),{
  text:window.location.href, width:150, height:150,
  colorDark:"#111111", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.H
});
document.head.appendChild(s);
</script>
</body>
</html>
